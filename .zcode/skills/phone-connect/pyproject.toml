[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-connect"
version = "1.0.0"
description = "Wireless ADB connection skill (implementation: tools/adb_connect.py)"
requires-python = ">=3.10"

[project.scripts]
phone-connect = "phone_connect:main"

[tool.hatch.build.targets.wheel]
packages = ["phone_connect"]
