[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-relocate"
version = "1.0.0"
description = "Repo relocation skill (implementation: tools/relocate_repo.py)"
requires-python = ">=3.10"

[project.scripts]
phone-relocate = "phone_relocate:main"

[tool.hatch.build.targets.wheel]
packages = ["phone_relocate"]
