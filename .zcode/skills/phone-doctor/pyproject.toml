[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-doctor"
version = "1.0.0"
description = "Environment health check skill (implementation: tools/doctor.py)"
requires-python = ">=3.10"

[project.scripts]
phone-doctor = "phone_doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["phone_doctor"]
