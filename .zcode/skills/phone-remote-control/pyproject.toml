[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-remote-control"
version = "1.0.0"
description = "Dashboard REST API client skill (implementation: tools/dashboard_client.py)"
requires-python = ">=3.10"

[project.scripts]
phone-remote-control = "phone_remote_control:main"

[tool.hatch.build.targets.wheel]
packages = ["phone_remote_control"]
