[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phone-update-check"
version = "1.0.0"
description = "Security-patch age check skill (implementation: tools/update_check.py)"
requires-python = ">=3.10"

[project.scripts]
phone-update-check = "phone_update_check:main"

[tool.hatch.build.targets.wheel]
packages = ["phone_update_check"]
