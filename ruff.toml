# Repo-wide ruff configuration for dashboard/ and diagnostics/.
# phone-lib/ keeps its own stricter config in phone-lib/pyproject.toml.
# Explicit `select` replaces ruff's default rule set, so future default
# expansions (like ruff 0.17's) can't silently break CI again.
target-version = "py310"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by line-length)
    "B008",   # function calls in default args
    "BLE001", # broad except is intentional in operational scripts
    "S110",   # try-except-pass is intentional cleanup best-effort
]

[lint.per-file-ignores]
"dashboard/**" = ["DTZ003"]  # metrics timestamps stored as UTC-naive by design

[lint.isort]
known-first-party = ["phone"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
