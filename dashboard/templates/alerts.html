<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="60">
  <title>Galaxy S22+ - Alerts</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6e6e6;
           margin: 0; padding: 2rem; }
    h1 { font-size: 1.4rem; }
    .alert { border-left: 4px solid #555; background: #1a1d24; padding: 0.8rem 1rem;
             margin: 0.6rem 0; border-radius: 4px; }
    .critical { border-color: #e5534b; }
    .warning  { border-color: #d29922; }
    .sev { font-weight: 700; text-transform: uppercase; font-size: 0.75rem;
           letter-spacing: 0.05em; }
    .critical .sev { color: #e5534b; }
    .warning .sev { color: #d29922; }
    .rec { color: #9aa4b2; font-size: 0.85rem; margin-top: 0.3rem; }
    .none { color: #3fb950; font-size: 1.1rem; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>Active Alerts</h1>
  {% if alerts %}
    {% for a in alerts %}
    <div class="alert {{ a.severity }}">
      <span class="sev">{{ a.severity }}</span>
      <span class="msg">{{ a.message }}</span>
      <div class="rec">{{ a.recommendation }}</div>
    </div>
    {% endfor %}
  {% else %}
    <div class="none">No active alerts - all monitored metrics are OK.</div>
  {% endif %}
  <p><a href="/">back to dashboard</a> &middot; auto-refreshes every 60s</p>
</body>
</html>
