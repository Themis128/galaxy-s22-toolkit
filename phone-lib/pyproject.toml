[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galaxy-s22-toolkit"
version = "0.6.0"
description = "ADB wrapper library for Samsung Galaxy phone diagnostics and management (S/Note/A, Android 10+)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Phone Toolkit", email = "user@example.com"}
]
keywords = ["android", "adb", "samsung", "galaxy", "diagnostics", "phone", "mobile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "asyncio",
]

[project.optional-dependencies]
notify = [
    "windows-toasts>=1.3",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests>=2.31.0",
    "windows-toasts>=1.3; sys_platform == 'win32'",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
]

[project.urls]
Homepage = "https://github.com/user/galaxy-s22-toolkit"
Repository = "https://github.com/user/galaxy-s22-toolkit"
Issues = "https://github.com/user/galaxy-s22-toolkit/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # function calls in default args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    # The OneDrive-synced tree re-applies the read-only attribute, so the
    # cache provider's writes fail noisily on every run - disable it
    "-p",
    "no:cacheprovider",
]
markers = [
    "device: marks tests as requiring a physical device",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phone"]

[tool.hatch.metadata]
allow-direct-references = false

[tool.coverage.run]
source = ["src/phone"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]